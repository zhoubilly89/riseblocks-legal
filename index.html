<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RiseBlocks — Stack the Rhythm</title>
<meta property="og:title" content="RiseBlocks — Stack the Rhythm">
<meta property="og:description" content="One-tap arcade stacking game. Beat your best streak.">
<meta property="og:image" content="https://zhoubilly89.github.io/riseblocks-legal/og.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(ellipse at center top, #3B1B6E 0%, #1A1346 60%, #0B0B1F 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card {
    max-width: 420px;
    width: 100%;
  }
  .logo {
    font-size: 64px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 2.4rem;
    font-weight: 900;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #FF3DA5, #FFC94B);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .tagline {
    font-size: 1rem;
    color: rgba(255,255,255,0.7);
    margin-bottom: 40px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 16px 24px;
    margin-bottom: 12px;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    color: #fff;
    background: linear-gradient(135deg, #39E0FF, #8A5BFF);
    transition: transform 0.15s;
  }
  .btn:hover { transform: scale(1.02); }
  .btn.android {
    background: linear-gradient(135deg, #7CF7C0, #39E0FF);
    color: #1A0F2E;
  }
  .redirect {
    color: rgba(255,255,255,0.5);
    font-size: 0.85rem;
    margin-top: 24px;
  }
  footer {
    margin-top: 60px;
    color: rgba(255,255,255,0.4);
    font-size: 0.8rem;
  }
  footer a { color: rgba(255,255,255,0.6); text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🎮</div>
  <h1>RiseBlocks</h1>
  <p class="tagline">Stack the rhythm. Feel the pulse. Rise.</p>

  <a id="ios" class="btn" href="https://apps.apple.com/app/id6766034957">📱 Download on App Store</a>
  <a id="android" class="btn android" href="https://play.google.com/store/apps/details?id=com.funs.funblock">▶ Get it on Google Play</a>

  <p class="redirect" id="redirect">Detecting your device…</p>

  <footer>
    <a href="privacy.html">Privacy</a> · <a href="support.html">Support</a><br>
    © 2026 RiseBlocks
  </footer>
</div>

<script>
  (function() {
    const ua = navigator.userAgent || '';
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const isAndroid = /Android/i.test(ua);
    const redirect = document.getElementById('redirect');

    if (isIOS) {
      redirect.textContent = 'Redirecting to App Store…';
      setTimeout(function() {
        window.location.href = 'https://apps.apple.com/app/id6766034957';
      }, 800);
    } else if (isAndroid) {
      redirect.textContent = 'Redirecting to Google Play…';
      setTimeout(function() {
        window.location.href = 'https://play.google.com/store/apps/details?id=com.funs.funblock';
      }, 800);
    } else {
      redirect.textContent = 'Choose your platform above.';
    }
  })();
</script>
</body>
</html>
